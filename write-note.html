
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>写一篇随笔</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="algorithm-header">
        <h1>写一篇随笔</h1>
        <p>记录生活里的小事，也记录偶尔冒出来的想法。</p>
        <a href="notes.html">← 返回日常随笔</a>
    </header>

    <main class="write-page">
        <input
            type="text"
            id="note-title"
            placeholder="给这篇随笔起个标题……"
        >

        <textarea
            id="note-content"
            placeholder="写下你想记录的东西……"
        ></textarea>

        <button id="save-note">保存随笔</button>
    </main>

    <script src="script.js"></script>
</body>
</html>
